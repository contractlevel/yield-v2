# Keep the hostname used by the already-deployed CRE workflow.
name = "yield-v2-defillama-relay"
main = "build/worker/shim.mjs"
compatibility_date = "2026-04-28"
workers_dev = true
preview_urls = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[[kv_namespaces]]
binding = "POOL_SNAPSHOTS"
id = "44242b29df88409aba961c271a5cfe09"

[triggers]
# Refresh 10, 5, and 2 minutes before the daily production rebalance (UTC).
crons = ["50,55,58 23 * * *"]

[build]
# Require locally configured tools and block build-time network access on macOS.
command = "sh build.sh"

# Set these as Worker secrets, not committed vars:
# npm exec --no -- wrangler secret put RELAY_BEARER_TOKEN
# npm exec --no -- wrangler secret put ETHEREUM_RPC_URL
# npm exec --no -- wrangler secret put ARBITRUM_RPC_URL
# npm exec --no -- wrangler secret put BASE_RPC_URL
# npm exec --no -- wrangler secret put OPTIMISM_RPC_URL

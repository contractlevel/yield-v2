[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
# @review-deploy before production deployment
optimizer_runs = 200
via_ir = true
no_match_contract = "CryticTester"

[invariant]
runs = 3000
depth = 15
fail_on_revert = true

[profile.invariants.invariant]
runs = 3000
depth = 15
fail_on_revert = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

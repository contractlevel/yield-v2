[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.34"
optimizer = true
optimizer_runs = 444
via_ir = false
no_match_contract = "CryticTester"

[invariant]
runs = 3000
depth = 15
fail_on_revert = true

[rpc_endpoints]
arbitrum = "${ARBITRUM_MAINNET_RPC_URL}"
avalanche = "${AVALANCHE_MAINNET_RPC_URL}"
base = "${BASE_MAINNET_RPC_URL}"
ethereum = "${ETHEREUM_MAINNET_RPC_URL}"
optimism = "${OPTIMISM_MAINNET_RPC_URL}"
polygon = "${POLYGON_MAINNET_RPC_URL}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
ethereum_sepolia = "${ETHEREUM_SEPOLIA_RPC_URL}"
optimism_sepolia = "${OPTIMISM_SEPOLIA_RPC_URL}"
avalanche_fuji = "${AVALANCHE_FUJI_RPC_URL}"
polygon_amoy = "${POLYGON_AMOY_RPC_URL}"

[etherscan]
arbitrum = { key = "${ETHERSCAN_API_KEY}", chain = 42161 }
avalanche = { key = "${ETHERSCAN_API_KEY}", chain = 43114 }
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
ethereum = { key = "${ETHERSCAN_API_KEY}", chain = 1 }
optimism = { key = "${ETHERSCAN_API_KEY}", chain = 10 }
polygon = { key = "${ETHERSCAN_API_KEY}", chain = 137 }
arbitrum_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 421614 }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
ethereum_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
optimism_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155420 }
polygon_amoy = { key = "${ETHERSCAN_API_KEY}", chain = 80002 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

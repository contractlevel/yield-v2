{
    "files": [
       "./certora/harness/modules/adapters/AaveV4AdapterHarness.sol",
       "./certora/harness/modules/adapters/mocks/MockAaveV4Vault.sol",
       "./certora/harness/modules/adapters/mocks/MockAaveV4Asset.sol",
       "./certora/harness/modules/adapters/mocks/MockAaveV4Spoke.sol",
       "./certora/harness/modules/adapters/mocks/MockAaveV4Hub.sol",
    ],

    "verify": "AaveV4AdapterHarness:./certora/spec/modules/adapters/AaveV4Adapter.spec",
    "wait_for_results": "all",
    "msg": "Verification of AaveV4Adapter protocol-specific behavior",
    "rule": [
        "ADAPTER_006_hubConfigurationMatchesAssetReserve",
        "CFG_001_getProtocolPool_EqualsSpoke",
        "ADAPTER_006_getReserveId_ResolvesAssetReserve",
        "getTVL_EqualsSpokeSuppliedAssetsPlusBufferedAssets",
        "ADAPTER_007_deposit_BuffersWhenPreviewIsZero",
        "ADAPTER_007_deposit_SuppliesWhenPreviewIsPositive",
        "ADAPTER_007_deposit_RevertWhen_HubPreviewFails",
    ],
    "optimistic_loop": true,
    "optimistic_fallback": true,
    "optimistic_hashing": true,
    "prover_args": [
        "-disabledTransformations OPTIMIZE_REVERT_STRINGS",
    ],

    "link": [
        "AaveV4AdapterHarness:i_vault=MockAaveV4Vault",
        "AaveV4AdapterHarness:i_asset=MockAaveV4Asset",
        "MockAaveV4Vault:i_asset=MockAaveV4Asset",
        "AaveV4AdapterHarness:i_spoke=MockAaveV4Spoke",
        "AaveV4AdapterHarness:i_hub=MockAaveV4Hub",
        "MockAaveV4Spoke:i_underlying=MockAaveV4Asset",
        "MockAaveV4Spoke:i_hub=MockAaveV4Hub",
    ],

    "parametric_contracts": "AaveV4AdapterHarness",
    "mutations": {
        "gambit": {
            "filename": "./src/modules/adapters/AaveV4Adapter.sol"
        }
    },
}

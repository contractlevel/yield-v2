{
    "files": [
       "./certora/harness/modules/adapters/AaveV4AdapterHarness.sol",
       "./certora/harness/modules/adapters/mocks/MockAaveV4Vault.sol",
       "./certora/harness/modules/adapters/mocks/MockAaveV4Asset.sol",
       "./certora/harness/modules/adapters/mocks/MockAaveV4SupplyErrorSpoke.sol",
       "./certora/harness/modules/adapters/mocks/MockAaveV4Hub.sol",
    ],

    "verify": "AaveV4AdapterHarness:./certora/spec/modules/adapters/AaveV4Adapter.SupplyErrors.spec",
    "wait_for_results": "all",
    "msg": "Verification of AaveV4Adapter nonexact supply errors",
    "rule": [
        "ADAPTER_007_revertMatcher_RejectsNonSelectorLength",
        "ADAPTER_007_revertMatcher_AcceptsExactSelector",
        "ADAPTER_007_revertMatcher_RejectsDifferentSelector",
        "ADAPTER_007_deposit_RevertWhen_SupplyReturnsOtherError",
        "ADAPTER_007_deposit_RevertWhen_InvalidSharesHasTrailingData",
        "ADAPTER_007_deposit_RevertWhen_SupplyReturnsShortData",
    ],
    "optimistic_loop": true,
    "optimistic_fallback": true,
    "optimistic_hashing": true,
    "prover_args": [
        "-disabledTransformations OPTIMIZE_REVERT_STRINGS",
    ],

    "link": [
        "AaveV4AdapterHarness:i_vault=MockAaveV4Vault",
        "AaveV4AdapterHarness:i_asset=MockAaveV4Asset",
        "MockAaveV4Vault:i_asset=MockAaveV4Asset",
        "AaveV4AdapterHarness:i_spoke=MockAaveV4SupplyErrorSpoke",
        "AaveV4AdapterHarness:i_hub=MockAaveV4Hub",
        "MockAaveV4SupplyErrorSpoke:i_underlying=MockAaveV4Asset",
        "MockAaveV4SupplyErrorSpoke:i_hub=MockAaveV4Hub",
    ],

    "parametric_contracts": "AaveV4AdapterHarness",
    "mutations": {
        "gambit": {
            "filename": "./src/modules/adapters/AaveV4Adapter.sol"
        }
    },
}

{
    "files": [
       "./certora/harness/modules/adapters/CompoundV3AdapterHarness.sol",
       "./test/mocks/MockVault.sol",
       "./certora/harness/mocks/MockUSDC.sol",
       "./certora/harness/modules/adapters/mocks/MockComet.sol",
       "./certora/harness/modules/adapters/mocks/MockCometRewards.sol",
    ],

    "verify": "CompoundV3AdapterHarness:./certora/spec/modules/ProtocolAdapter.spec",
    "wait_for_results": "all",
    "msg": "Verification of CompoundV3Adapter shared ProtocolAdapter behavior",
    "optimistic_loop": true,
    "optimistic_fallback": true,
    "optimistic_hashing": true,

    "exclude_rule": [
        "ADAPTER_007_deposit_RevertWhen_AmountIsZero",
        "ADAPTER_007_deposit_Buffered_Success",
        "ADAPTER_007_deposit_Buffered_RevertWhen_LimitExceeded",
        "ADAPTER_007_deposit_Success_FlushesBufferedAssets",
        "ADAPTER_007_deposit_WithBufferedAssets_RevertWhen_TVLDecreases",
        "ADAPTER_007_deposit_WithBufferedAssets_RevertWhen_CreditedShortfallExceedsRoundingTolerance",
        "ADAPTER_007_deposit_WithBufferedAssets_RevertWhen_ProtocolSupplyFails",
        "ADAPTER_008_ADAPTER_009_withdraw_Epoch_Success_FromBufferedAssetsOnly",
        "ADAPTER_008_ADAPTER_009_withdraw_Rebalance_Success_FromBufferedAssetsOnly",
        "ADAPTER_008_ADAPTER_009_withdraw_WithBufferedAssets_Success",
        "ADAPTER_008_withdraw_WithBufferedAssets_RevertWhen_ProtocolReturnsZero",
        "ADAPTER_008_withdraw_WithBufferedAssets_RevertWhen_ProtocolAmountIsInsufficient",
        "ADAPTER_008_withdraw_WithBufferedAssets_RevertWhen_ProtocolWithdrawalFails",
        "ADAPTER_004_withdraw_WithBufferedAssets_RevertWhen_CallerIsNotVault",
        "REENT_001_withdraw_WithBufferedAssets_RevertWhen_ReentrancyGuardIsEntered",
        "ADAPTER_008_withdraw_Rebalance_RevertWhen_AccountedTVLIsZero",
        "ADAPTER_008_withdraw_WithBufferedAssets_RevertWhen_AmountIsZero"
    ],

    "link": [
        "CompoundV3AdapterHarness:i_vault=MockVault",
        "CompoundV3AdapterHarness:i_asset=MockUSDC",
        "MockVault:i_asset=MockUSDC",
        "CompoundV3AdapterHarness:i_comet=MockComet",
        "CompoundV3AdapterHarness:i_cometRewards=MockCometRewards",
        "MockComet:i_asset=MockUSDC",
        "MockCometRewards:i_rewardToken=MockUSDC",
    ],

    "parametric_contracts": "CompoundV3AdapterHarness",
    "mutations": {
        "gambit": {
            "filename": "./src/modules/adapters/CompoundV3Adapter.sol"
        }
    },
}

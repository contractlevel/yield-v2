{
    "files": [
        "./src/vaults/ParentVault.sol",
        "./certora/harness/mocks/MockUSDC.sol",
        "./certora/harness/mocks/MockLINK.sol",
        "./certora/harness/mocks/MockInvariantAdapterRegistry.sol",
        "./certora/harness/mocks/MockProtocolAdapter.sol",
        "./certora/harness/mocks/MockCCIPRouter.sol",
        "./certora/harness/mocks/MockYieldcoinShare.sol"
    ],

    "verify": "ParentVault:./certora/spec/vaults/ParentVault.invariants.spec",
    "wait_for_results": "all",
    "msg": "Verification of ParentVault invariants against the production ABI",
    "optimistic_loop": true,
    "optimistic_fallback": true,
    "optimistic_hashing": true,
    "optimistic_summary_recursion": true,
    "summary_recursion_limit": 1,
    "optimistic_contract_recursion": true,
    "contract_recursion_limit": 1,
    "disable_internal_function_instrumentation": true,
    "storage_extension_annotation": true,
    "extract_storage_extension_annotation": true,

    "link": [
        "ParentVault:i_asset=MockUSDC",
        "ParentVault:i_link=MockLINK",
        "ParentVault:i_adapterRegistry=MockInvariantAdapterRegistry",
        "ParentVault:i_ccipRouter=MockCCIPRouter",
        "ParentVault:i_share=MockYieldcoinShare",
        "MockInvariantAdapterRegistry:i_adapter=MockProtocolAdapter",
        "MockProtocolAdapter:i_vault=ParentVault",
        "MockProtocolAdapter:i_asset=MockUSDC"
    ],

    "parametric_contracts": "ParentVault",
    "mutations": {
        "gambit": {
            "filename": "./src/vaults/ParentVault.sol"
        }
    }
}
